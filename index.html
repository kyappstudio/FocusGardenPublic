<style>
  :root{ --bg:#f6f7f4; --ink:#16201b; --muted:#5c6b63; --rule:#dde3de; --accent:#2e6b52; }

    :root{ --bg:#101512; --ink:#e6ece7; --muted:#93a39a; --rule:#26302b; --accent:#79c4a2; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",-apple-system,"Segoe UI",sans-serif;

  ul{list-style:none;padding:0;margin:0}
  li{border-top:1px solid var(--rule);padding:1.1rem 0}
  li:last-child{border-bottom:1px solid var(--rule)}
  a{color:var(--accent);font-size:1.05rem;text-decoration:none;font-weight:600}
  a:hover{text-decoration:underline}
  .v{display:block;color:var(--muted);font-size:.8rem;margin-top:.15rem}
  footer{margin-top:3rem;color:var(--muted);font-size:.8rem;line-height:1.8}
